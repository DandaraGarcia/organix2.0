<!DOCTYPE html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Trabalho | Organix</title>
<body data-app data-premium><div class="app"><aside id="menu"></aside><main><h1>Rotina de trabalho</h1><div class="conteudo"><div class="grid g2" style="align-items:start">
<div class="card c4"><h2>Bloco de foco</h2><div class="tempo" id="tp">25:00</div><div class="linha" style="justify-content:center"><button class="btn" id="ini">Iniciar</button><button class="btn" id="zer">Reiniciar</button></div>
<form class="form" id="fm" style="grid-template-columns:1fr auto;margin:14px 0 0"><div><label for="min">Duração do bloco (minutos)</label><input id="min" type="number" min="1" max="240" step="1" required></div><button class="btn">Definir</button></form>
<div class="chips" id="chips"><button class="btn" data-m="15">15 min</button><button class="btn" data-m="25">25 min</button><button class="btn" data-m="45">45 min</button><button class="btn" data-m="60">60 min</button></div>
<p class="mut" id="fh" style="margin-top:12px"></p></div>
<div><div class="linha"><h2 style="margin:0">Tarefas de hoje</h2><button class="btn peq perigo" id="limpar">Limpar</button></div>
<ul class="lista" id="lista" style="margin-top:12px"></ul>
<form class="card form" id="f" style="grid-template-columns:2fr 1fr auto"><div><label for="n">Nova tarefa</label><input id="n" maxlength="60" required></div><div><label for="h">Horário (opcional)</label><input id="h" type="time"></div><button class="btn verde">Adicionar</button></form>
<div class="linha"><div class="barra"><div id="bp"></div></div><b id="pc">0%</b></div></div></div></div></main></div><script src="app.js"></script><script>
(()=>{
let T=load('trab',{});
T={min:25,tarefas:[],dia:'',foco:{},snap:{},arq:{},...T};
const sv=()=>save('trab',T);
/* novo dia: as tarefas continuam, mas voltam desmarcadas */
if(T.dia&&T.dia!==hoje()){T.tarefas.forEach(x=>x.ok=false)}
T.dia=hoje();sv();

/* tarefas */
function snapshot(){
  const d=hoje(),arq=T.arq[d]||[],atu=T.tarefas.map(x=>({t:x.t,h:x.h,ok:x.ok}));
  if(arq.length||atu.some(x=>x.ok)||T.snap[d])T.snap[d]=[...arq,...atu];
}
function ver(){
  const ts=T.tarefas,n=ts.filter(x=>x.ok).length,p=ts.length?Math.round(n/ts.length*100):0;
  $('#lista').innerHTML=ts.length?ts.map(x=>`<li class="${x.ok?'feito':''}" data-id="${x.id}"><label><input type="checkbox" ${x.ok?'checked':''}><span class="t">${esc(x.t)}</span></label>${x.h?`<span class="h">${esc(x.h)}</span>`:''}<button class="x" aria-label="Remover ${esc(x.t)}">×</button></li>`).join(''):'<li class="vazio-msg">Nenhuma tarefa. Escreva a primeira abaixo.</li>';
  $('#bp').style.width=p+'%';$('#pc').textContent=p+'%';
}
const mud=()=>{snapshot();sv();ver()};
$('#lista').addEventListener('change',e=>{const t=T.tarefas.find(x=>x.id===e.target.closest('li').dataset.id);if(t){t.ok=e.target.checked;mud()}});
$('#lista').addEventListener('click',e=>{const b=e.target.closest('.x');if(!b)return;T.tarefas=T.tarefas.filter(x=>x.id!==b.closest('li').dataset.id);mud();toast('Tarefa removida')});
$('#f').onsubmit=e=>{e.preventDefault();const t=$('#n').value.trim();if(!t)return;T.tarefas.push({id:uid(),t,h:$('#h').value,ok:false});mud();e.target.reset();$('#n').focus()};
$('#limpar').onclick=async()=>{
  if(!T.tarefas.length){toast('Não há tarefas para limpar');return}
  if(!await ask('Apagar todas as tarefas atuais? O que você já concluiu continua no resumo do dia.'))return;
  const d=hoje();T.arq[d]=[...(T.arq[d]||[]),...T.tarefas.filter(x=>x.ok).map(x=>({t:x.t,h:x.h,ok:true}))];
  T.tarefas=[];mud();toast('Lista limpa. Escreva suas novas tarefas');$('#n').focus();
};

/* bloco de foco */
let seg=T.min*60,fim=0,tm=0;
const mostra=()=>$('#tp').textContent=pad(Math.floor(seg/60))+':'+pad(seg%60);
const info=()=>{const f=T.foco[hoje()];$('#fh').textContent=f?`Hoje: ${f.n} bloco${f.n>1?'s':''} concluído${f.n>1?'s':''} (${f.min} min de foco)`:'Nenhum bloco de foco concluído hoje.'};
function para(){clearInterval(tm);tm=0}
function reinicia(){para();seg=T.min*60;mostra();$('#ini').textContent='Iniciar'}
function tick(){seg=Math.max(0,Math.round((fim-Date.now())/1000));mostra();
  if(seg<=0){const f=T.foco[hoje()]||(T.foco[hoje()]={n:0,min:0});f.n++;f.min+=T.min;sv();info();reinicia();toast('Bloco de foco concluído')}}
$('#ini').onclick=()=>{if(tm){para();$('#ini').textContent='Continuar'}else{fim=Date.now()+seg*1000;tm=setInterval(tick,250);$('#ini').textContent='Pausar'}};
$('#zer').onclick=reinicia;
function define(v){v=Math.round(+v);if(!(v>=1&&v<=240)){toast('Escolha um tempo entre 1 e 240 minutos');return}T.min=v;sv();$('#min').value=v;reinicia();toast('Bloco de foco definido para '+v+' min')}
$('#fm').onsubmit=e=>{e.preventDefault();define($('#min').value)};
$('#chips').onclick=e=>{const b=e.target.closest('[data-m]');if(b)define(b.dataset.m)};
$('#min').value=T.min;mostra();info();ver();novoDia(()=>{if(!tm)location.reload()});
})();
</script>
